<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payments – DairyERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div style="font-weight:600;margin-bottom:10px;">Payments</div>
    <div style="margin-top:auto;font-size:12px;">
      <span id="sidebar-user-name">User</span><br>
      <span id="sidebar-user-role" style="color:#6b7280;">Admin</span><br>
      <button id="btn-logout" style="font-size:12px;margin-top:6px;">Sign out</button>
    </div>
  </aside>
  <main class="app-main">
    <h1 style="font-size:18px;margin-bottom:8px;">Payments</h1>

    <form id="payment-entry-form" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      <select id="payment-party-type" required style="flex:1;min-width:100px;">
        <option value="farmer">Farmer (we pay)</option>
        <option value="customer">Customer (they pay)</option>
      </select>
      <select id="payment-party" required style="flex:2;min-width:120px;"></select>
      <input id="payment-date-input" type="date" required style="flex:1;min-width:120px;">
      <input id="payment-amount" type="number" step="0.01" min="0" placeholder="Amount" required style="flex:1;min-width:80px;">
      <select id="payment-mode" required style="flex:1;min-width:100px;">
        <option value="Cash">Cash</option>
        <option value="Bank">Bank</option>
        <option value="UPI">UPI</option>
      </select>
      <input id="payment-notes" type="text" placeholder="Notes" style="flex:2;min-width:120px;">
      <button type="submit" class="btn-primary" style="flex:0 0 auto;">Save</button>
    </form>

    <table class="table" id="table-payments">
      <thead>
        <tr>
          <th>Date</th>
          <th>Party</th>
          <th>Type</th>
          <th>Mode</th>
          <th>Amount</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
</div>

<div class="toast" id="app-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
