<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Farmers – DairyERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div style="font-weight:600;margin-bottom:10px;">Farmers</div>
    <div style="margin-top:auto;font-size:12px;">
      <span id="sidebar-user-name">User</span><br>
      <span id="sidebar-user-role" style="color:#6b7280;">Admin</span><br>
      <button id="btn-logout" style="font-size:12px;margin-top:6px;">Sign out</button>
    </div>
  </aside>
  <main class="app-main">
    <h1 style="font-size:18px;margin-bottom:8px;">Farmers / Suppliers</h1>

    <form id="farmer-form" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      <input id="farmer-code" type="text" placeholder="Code" required style="flex:1;min-width:80px;">
      <input id="farmer-name" type="text" placeholder="Name" required style="flex:2;min-width:120px;">
      <input id="farmer-phone" type="text" placeholder="Phone" style="flex:1;min-width:100px;">
      <input id="farmer-address" type="text" placeholder="Address" style="flex:2;min-width:120px;">
      <button type="submit" class="btn-primary" style="flex:0 0 auto;">Add</button>
    </form>

    <table class="table" id="table-farmers">
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
</div>

<div class="toast" id="app-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
