<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Milk Collection – DairyERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div style="font-weight:600;margin-bottom:10px;">Milk collection</div>
    <div style="margin-top:auto;font-size:12px;">
      <span id="sidebar-user-name">User</span><br>
      <span id="sidebar-user-role" style="color:#6b7280;">Admin</span><br>
      <button id="btn-logout" style="font-size:12px;margin-top:6px;">Sign out</button>
    </div>
  </aside>
  <main class="app-main">
    <h1 style="font-size:18px;margin-bottom:8px;">Milk collection</h1>

    <form id="milk-entry-form" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      <select id="milk-farmer" required style="flex:2;min-width:120px;"></select>
      <input id="milk-date-input" type="date" required style="flex:1;min-width:120px;">
      <select id="milk-shift" required style="flex:1;min-width:80px;">
        <option value="Morning">Morning</option>
        <option value="Evening">Evening</option>
      </select>
      <input id="milk-qty" type="number" step="0.01" min="0" placeholder="Qty L" required style="flex:1;min-width:80px;">
      <input id="milk-rate" type="number" step="0.01" min="0" placeholder="Rate" required style="flex:1;min-width:80px;">
      <input id="milk-amount" type="number" step="0.01" min="0" placeholder="Amount" readonly style="flex:1;min-width:80px;">
      <button type="submit" class="btn-primary" style="flex:0 0 auto;">Save</button>
    </form>

    <table class="table" id="table-milk-entries">
      <thead>
        <tr>
          <th>Date</th>
          <th>Farmer</th>
          <th>Shift</th>
          <th>Qty</th>
          <th>Rate</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
</div>

<div class="toast" id="app-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
