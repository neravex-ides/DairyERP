<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DairyERP Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <img src="../assets/images/logo.png" alt="Logo" style="width:30px;height:30px;border-radius:8px;">
      <div>
        <div style="font-weight:600;font-size:14px;">DairyERP</div>
        <div style="font-size:11px;color:#6b7280;">Dashboard</div>
      </div>
    </div>
    <div style="font-size:12px;margin-top:auto;">
      <div style="margin-bottom:6px;">
        <span id="sidebar-user-name">User</span><br>
        <span id="sidebar-user-role" style="color:#6b7280;">Admin</span>
      </div>
      <button id="btn-logout" style="font-size:12px;">Sign out</button>
    </div>
  </aside>
  <main class="app-main">
    <h1 style="font-size:20px;">Dashboard</h1>
    <p style="font-size:13px;color:#6b7280;margin-bottom:12px;">
      Today’s milk & payments summary.
    </p>

    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <div style="flex:1;background:#fff;border-radius:14px;padding:10px;border:1px solid #e5e7eb;">
        <div style="font-size:12px;color:#6b7280;">Milk collected (today)</div>
        <div id="stat-total-milk" style="font-size:18px;font-weight:600;">0.00 L</div>
        <div style="font-size:11px;color:#6b7280;">Farmers: <span id="stat-total-farmers">0</span></div>
      </div>
      <div style="flex:1;background:#fff;border-radius:14px;padding:10px;border:1px solid #e5e7eb;">
        <div style="font-size:12px;color:#6b7280;">Payments (today)</div>
        <div id="stat-payments-received" style="font-size:18px;font-weight:600;">₹0.00</div>
        <div style="font-size:11px;color:#6b7280;">Pending: <span id="stat-payments-pending">₹0.00</span></div>
      </div>
    </div>

    <h2 style="font-size:14px;margin-top:8px;margin-bottom:4px;">Recent milk entries</h2>
    <table class="table" id="table-latest-milk">
      <thead>
        <tr>
          <th>Date</th>
          <th>Farmer</th>
          <th>Shift</th>
          <th>Qty (L)</th>
          <th>Rate</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 style="font-size:14px;margin-top:14px;margin-bottom:4px;">Recent payments</h2>
    <table class="table" id="table-latest-payments">
      <thead>
        <tr>
          <th>Date</th>
          <th>Party</th>
          <th>Type</th>
          <th>Mode</th>
          <th>Amount</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
</div>

<div class="toast" id="app-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
