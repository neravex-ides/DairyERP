<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DairyERP Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <img src="../assets/images/logo.png" alt="Logo" style="width:30px;height:30px;border-radius:8px;">
      <div>
        <div style="font-weight:600;font-size:14px;">DairyERP</div>
        <div style="font-size:11px;color:#6b7280;">Dashboard</div>
      </div>
    </div>
    <div style="margin-top:auto;">
      <div style="font-size:12px;margin-bottom:6px;">
        <span id="sidebar-user-name">User</span><br>
        <span id="sidebar-user-role" style="color:#6b7280;">Role</span>
      </div>
      <button id="btn-logout" style="font-size:12px;">Sign out</button>
    </div>
  </aside>
  <main class="app-main">
    <h1>Welcome to DairyERP</h1>
    <p style="margin-top:4px;font-size:13px;color:#6b7280;">
      You are logged in via Firebase authentication (Email or Google).
    </p>
  </main>
</div>

<div class="toast" id="app-toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
