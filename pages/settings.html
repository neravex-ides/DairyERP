<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings – DairyERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
      <aside class="app-sidebar">
    <!-- Brand / Title -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <img src="../assets/images/logo.png" alt="Logo" style="width:30px;height:30px;border-radius:8px;">
      <div>
        <div style="font-weight:600;font-size:14px;">DairyERP</div>
        <div style="font-size:11px;color:#6b7280;">Dashboard</div>
      </div>
    </div>

    <!-- MAIN NAV: यहाँ सारे pages clearly दिखेंगे -->
    <nav style="font-size:13px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;">
      <a href="dashboard.html">Dashboard</a>
      <a href="farmers.html">Farmers</a>
      <a href="customers.html">Customers</a>
      <a href="milk-collection.html">Milk collection</a>
      <a href="payments.html">Payments</a>
      <a href="sales.html">Sales</a>
      <a href="reports.html">Reports</a>
      <a href="settings.html">Settings</a>
      <a href="cattle-feed.html">Cattle feed</a>
      <a href="help.html">Help</a>
    </nav>

    <!-- User info + logout -->
    <div style="font-size:12px;margin-top:auto;">
      <div style="margin-bottom:6px;">
        <span id="sidebar-user-name">User</span><br>
        <span id="sidebar-user-role" style="color:#6b7280;">Admin</span>
      </div>
      <button id="btn-logout" style="font-size:12px;">Sign out</button>
    </div>
  </aside>

    <main class="app-main">
        <header class="app-header">
            <div class="app-title-block">
                <h1>Settings</h1>
                <span>Dairy profile and basic configuration.</span>
            </div>
        </header>

        <section class="grid grid-2">
            <article class="card">
                <header class="card-header">
                    <div>
                        <div class="card-title">Dairy profile</div>
                        <div class="card-subtitle">Your dairy / society information.</div>
                    </div>
                </header>

                <form class="form-inline" id="settings-dairy-form">
                    <div class="field">
                        <div class="field-label"><label for="set-dairy-name">Name</label></div>
                        <div class="input-control">
                            <input type="text" id="set-dairy-name" required>
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label"><label for="set-dairy-owner">Owner / Manager</label></div>
                        <div class="input-control">
                            <input type="text" id="set-dairy-owner">
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label"><label for="set-dairy-phone">Phone</label></div>
                        <div class="input-control">
                            <input type="text" id="set-dairy-phone">
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label"><label for="set-dairy-address">Address</label></div>
                        <div class="input-control">
                            <input type="text" id="set-dairy-address">
                        </div>
                    </div>
                    <div class="field" style="align-self:flex-end;min-width:140px;">
                        <button type="submit" class="btn-primary">Save profile</button>
                    </div>
                </form>
            </article>

            <article class="card">
                <header class="card-header">
                    <div>
                        <div class="card-title">Defaults</div>
                        <div class="card-subtitle">Default rate etc. used in forms.</div>
                    </div>
                </header>

                <form class="form-inline" id="settings-defaults-form">
                    <div class="field">
                        <div class="field-label"><label for="set-default-milk-rate">Default milk rate (₹/L)</label></div>
                        <div class="input-control">
                            <input type="number" step="0.01" min="0" id="set-default-milk-rate">
                        </div>
                    </div>
                    <div class="field">
                        <div class="field-label"><label for="set-default-language">Language</label></div>
                        <div class="input-control">
                            <select id="set-default-language">
                                <option value="en">English</option>
                                <option value="hi">Hindi</option>
                            </select>
                        </div>
                    </div>
                    <div class="field" style="align-self:flex-end;min-width:140px;">
                        <button type="submit" class="btn-primary">Save defaults</button>
                    </div>
                </form>
            </article>
        </section>
    </main>
</div>

<div class="toast" id="app-toast"></div>
<script src="../js/app.js"></script>
</body>
</html>
