<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account – DairyERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">
<div class="auth-wrapper">
    <aside class="auth-hero">
        <header class="auth-hero-header">
            <div class="auth-logo">
                <img src="assets/images/logo.png" alt="DairyERP Logo">
            </div>
            <div>
                <div class="auth-brand">DairyERP</div>
                <div style="font-size:11px;color:#6b7280;">Multi-branch dairy ERP</div>
            </div>
        </header>

        <main class="auth-hero-body">
            <h1 class="auth-hero-title">
                Setup your dairy, farmers & customers in minutes.
            </h1>
            <p class="auth-hero-text">
                Add milk suppliers and buyers with auto statements and payment tracking.
            </p>
        </main>

        <footer class="auth-hero-footer">
            <span>✔ Works on mobile & desktop</span>
        </footer>
    </aside>

    <section class="auth-panel">
        <div class="auth-panel-inner">
            <header class="auth-panel-header">
                <div>
                    <h2 class="auth-title">Create your DairyERP account</h2>
                    <p class="auth-subtitle">Just a few details to get started.</p>
                </div>
                <div class="auth-badge">Email + Google</div>
            </header>

            <div class="auth-oauth">
                <button class="btn-google" type="button" data-auth="google-register">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    <span>Sign up with Google</span>
                </button>
            </div>

            <div class="auth-divider"><span>or using email</span></div>

            <form class="auth-form" id="register-form">
                <div class="field">
                    <div class="field-label">
                        <label for="reg-name">Full name</label>
                    </div>
                    <div class="input-control">
                        <input type="text" id="reg-name" required>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="reg-dairy-name">Dairy / Society name</label>
                    </div>
                    <div class="input-control">
                        <input type="text" id="reg-dairy-name" required>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="reg-email">Official email</label>
                    </div>
                    <div class="input-control">
                        <input type="email" id="reg-email" required>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="reg-password">Password</label>
                        <span>Min 8 chars</span>
                    </div>
                    <div class="input-control">
                        <input type="password" id="reg-password" required minlength="8">
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Create account & go to dashboard
                </button>
            </form>
        </div>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
