<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – DairyERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">
<div class="auth-wrapper">
    <aside class="auth-hero">
        <header class="auth-hero-header">
            <div class="auth-logo">
                <img src="assets/images/logo.png" alt="DairyERP Logo">
            </div>
            <div>
                <div class="auth-brand">DairyERP</div>
                <div style="font-size:11px;color:#6b7280;">Daily dairy ERP</div>
            </div>
        </header>

        <main class="auth-hero-body">
            <h1 class="auth-hero-title">
                Login to manage milk, feed & payments.
            </h1>
            <p class="auth-hero-text">
                Secure login with Email or Google. Data synced via Firebase.
            </p>
        </main>

        <footer class="auth-hero-footer">
            <span>✔ Farmer milk entries</span>
            <span>✔ Payments & reports</span>
        </footer>
    </aside>

    <section class="auth-panel">
        <div class="auth-panel-inner">
            <header class="auth-panel-header">
                <div>
                    <h2 class="auth-title">Sign in</h2>
                    <p class="auth-subtitle">Email & password or Google.</p>
                </div>
                <div class="auth-badge">Firebase Auth</div>
            </header>

            <div class="auth-oauth">
                <button class="btn-google" type="button" data-auth="google-login">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    <span>Sign in with Google</span>
                </button>
            </div>

            <div class="auth-divider"><span>or using email</span></div>

            <form class="auth-form" id="login-form">
                <div class="field">
                    <div class="field-label">
                        <label for="login-email">Email</label>
                    </div>
                    <div class="input-control">
                        <input type="email" id="login-email" required>
                    </div>
                </div>
                <div class="field">
                    <div class="field-label">
                        <label for="login-password">Password</label>
                        <span id="login-forgot-link" style="cursor:pointer;color:#2563eb;">Forgot password?</span>
                    </div>
                    <div class="input-control">
                        <input type="password" id="login-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    Sign in to DairyERP
                </button>
            </form>

            <div class="auth-footer">
                <div>
                    <span>Don't have an account?</span>
                    <a href="register.html" style="color:#2563eb;">Create account</a>
                </div>
            </div>
        </div>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
